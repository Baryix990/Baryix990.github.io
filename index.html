<title>Makieta aplikacji</title>
<style>
:root{--bg:#111318;--tx:#fafafa;--mu:#9aa1ad;--pr:#5b9bf0;--bar:#1b1c20;--ln:#2a2d34}
[data-theme=light]{--bg:#f4f5f7;--tx:#16181d;--mu:#6b7280;--pr:#1f5fc4;--bar:#fff;--ln:#e3e5ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:24px;height:24px;display:block}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top)}
.screen{display:none;flex:1;overflow-y:auto;padding:4px 16px 24px}
.screen.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;height:44px}
.logo{width:32px;height:32px;border-radius:8px;background:#d4213d;color:#fff;font-weight:700;display:grid;place-items:center}
.bell{position:relative;color:var(--pr)}
.bell:after{content:"";position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:#e5384f}
h1{font-size:34px;line-height:1.15;margin:12px 0 8px;font-weight:700}
.acts{display:flex;justify-content:flex-end;gap:16px;font-size:13px;color:var(--pr);font-weight:600;margin-bottom:12px}
.card{display:block;position:relative;width:100%;height:226px;border-radius:16px;padding:8px 16px 16px;margin-bottom:16px;text-align:left;color:#fff;box-shadow:0 8px 12px rgba(0,0,0,.25);background:radial-gradient(120% 80% at 0% 100%,color-mix(in srgb,var(--c) 55%,#000),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--c) 90%,#000),var(--c) 55%,color-mix(in srgb,var(--c) 90%,#fff));transition:transform .15s}
.card:active{transform:scale(.98)}
.ch{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-weight:600}
.ch .logo{width:28px;height:28px;margin-right:8px}
.x{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:#e5384f;color:#fff;font-weight:700;display:none;place-items:center}
.edit .x{display:grid}
.empty{color:var(--mu);text-align:center;padding:48px 0}
nav{display:flex;background:var(--bar);border-top:1px solid var(--ln);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--mu)}
nav button.on{color:var(--pr)}
nav .f,nav .on .o{display:none}nav .on .f{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;justify-items:center;margin-top:16px}
.sc{width:80px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;text-align:center}
.sc i{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 8px rgba(0,0,0,.08),0 0 2px rgba(0,0,0,.1);color:var(--c)}
input{width:100%;height:48px;border-radius:12px;border:1px solid var(--ln);background:transparent;color:var(--tx);padding:0 16px;font:inherit}
input:focus{outline:2px solid var(--pr);outline-offset:1px}
.vf{position:relative;height:300px;margin:32px auto 24px;width:260px}
.vf:before,.vf:after,.vf i:before,.vf i:after{content:"";position:absolute;width:40px;height:40px;border:4px solid var(--pr)}
.vf:before{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:16px}
.vf:after{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:16px}
.vf i:before{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:16px}
.vf i:after{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:16px}
.btn{display:block;width:100%;height:48px;border-radius:12px;background:var(--pr);color:#fff;font-weight:600}
.btn:active{filter:brightness(.85)}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.sw{width:51px;height:31px;border-radius:16px;background:#5b606b;position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--pr)}.sw.on:after{transform:translateX(20px)}
.acc{display:none;color:var(--mu);font-size:15px;padding:8px 0 16px}.acc.on{display:block}
#det{position:absolute;inset:0;padding-top:env(safe-area-inset-top);background:var(--bg);transform:translateX(100%);transition:transform .25s;overflow-y:auto;z-index:5}
#det.open{transform:none}
.back{display:flex;align-items:center;height:44px;padding:0 12px;color:var(--pr);font-weight:600}
.back svg{transform:rotate(0)}
#det .in{padding:0 16px 32px}
.warn{border:1px solid #e0a030;color:#e0a030;border-radius:12px;padding:12px 16px;font-size:14px;margin:0 0 16px}
.ir{padding:12px 0;border-bottom:1px solid var(--ln)}.ir small{display:block;color:var(--mu);font-size:13px}.ir b{font-weight:600}
.ok{display:flex;gap:8px;align-items:center;font-weight:600;margin:16px 0}.ok:before{content:"";width:10px;height:10px;border-radius:50%;background:#34c759}
#snack{position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:#2b2e35;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:9}
#snack.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="acts"><button id="edit">Dostosuj</button><button id="add">Dodaj</button></div>

  <div class="top"></div><h1>Usługi</h1>

function snack(t){const s=$('#snack');s.textContent=t;s.classList.add('on');clearTimeout(snack.t);snack.t=setTimeout(()=>s.classList.remove('on'),2400)}
function tab(n){$$('.screen').forEach(e=>e.classList.toggle('on',e.id==='s-'+n));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));$('#det').classList.remove('open')}
$$('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function drawDocs(){const box=$('#cards');box.className=editing?'edit':'';box.innerHTML=docs.length?'':'<p class="empty">Brak dokumentów. Wybierz Dodaj.</p>';
 docs.forEach((d,i)=>{const w=document.createElement('div');w.style.position='relative';w.innerHTML=`<button class="card" style="--c:${d.c}"><div class="ch"><span>${d.n}</span><span class="logo">m</span></div></button><button class="x" aria-label="Usuń">×</button>`;
  w.firstChild.onclick=()=>editing?0:openDoc(d);w.lastChild.onclick=()=>{docs.splice(i,1);store.set('docs',docs);drawDocs()};box.append(w)})}
function openDoc(d){$('#detIn').innerHTML=`<h1 style="margin-top:4px">${d.n}</h1><p class="warn">MAKIETA: to nie jest prawdziwy dokument. Wszystkie dane są przykładowe.</p><div class="ok">Dokument ważny (przykład)</div>${[['Imię i nazwisko','Jan Przykładowy'],['Numer dokumentu','XXX 000000'],['PESEL','00000000000'],['Data urodzenia','01.01.1990'],['Ważny do','01.01.2030']].map(r=>`<div class="ir"><small>${r[0]}</small><b>${r[1]}</b></div>`).join('')}`;$('#det').classList.add('open')}
$('#back').onclick=()=>$('#det').classList.remove('open');
$('#edit').onclick=()=>{editing=!editing;$('#edit').textContent=editing?'Gotowe':'Dostosuj';drawDocs()};
$('#add').onclick=()=>{const n=EXTRA.find(e=>!docs.some(d=>d.n===e.n));if(!n)return snack('To wszystkie dokumenty przykładowe');docs.push(n);store.set('docs',docs);drawDocs()};
$('#bell').onclick=()=>snack('Brak nowych powiadomień (makieta)');
function drawSvc(f=''){const g=$('#grid');g.innerHTML='';SVC.filter(s=>s[0].toLowerCase().includes(f.toLowerCase())).forEach(s=>{const b=document.createElement('button');b.className='sc';b.style.setProperty('--c',s[2]);b.innerHTML=`<i>${s[1]}</i>${s[0]}`;b.onclick=()=>snack('Makieta: ta usługa nie jest dostępna');g.append(b)})}
$('#q').oninput=e=>drawSvc(e.target.value);
$('#scan').onclick=()=>snack('Makieta: skaner jest wyłączony');
function theme(l){document.documentElement.dataset.theme=l?'light':'dark';$('#theme').classList.toggle('on',l);$('meta[name=theme-color]').content=l?'#f4f5f7':'#111318';store.set('light',l)}
$('#theme').onclick=()=>theme(!$('#theme').classList.contains('on'));
$('#pin').onclick=e=>{e.currentTarget.classList.toggle('on');snack('Makieta: blokada PIN nic nie robi')};
$('#about').onclick=()=>$('#aboutT').classList.toggle('on');
$('#reset').onclick=()=>{docs=DEF.slice();store.set('docs',docs);editing=false;$('#edit').textContent='Dostosuj';drawDocs();snack('Przywrócono dane makiety')};
theme(store.get('light',false));drawDocs();drawSvc();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
